<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>BuzSport – مباريات اليوم</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg,#020617,#020617);
  color:white;
}
header{
  text-align:center;
  padding:20px;
  font-size:26px;
  color:#38bdf8;
}
.match{
  background:#0f172a;
  margin:10px;
  padding:15px;
  border-radius:10px;
}
.teams{
  font-size:18px;
  font-weight:bold;
}
.time{
  color:#94a3b8;
  margin-top:6px;
}
</style>
</head>

<body>

<header>⚽ مباريات اليوم</header>

<div id="matches"></div>

<script>
// بيانات تجريبية (خدامة دائما)
const matches = [
  { teams: "Real Madrid vs Barcelona", time: "21:00" },
  { teams: "Manchester City vs Arsenal", time: "18:30" },
  { teams: "PSG vs Marseille", time: "20:45" },
  { teams: "Wydad vs Raja", time: "22:00" }
];

let html = "";
matches.forEach(m => {
  html += `
    <div class="match">
      <div class="teams">${m.teams}</div>
      <div class="time">⏰ ${m.time}</div>
    </div>
  `;
});

document.getElementById("matches").innerHTML = html;
</script>

</body>
</html>
