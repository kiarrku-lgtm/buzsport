<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مباريات اليوم</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg,#050b1e,#020617);
  color:#fff;
  transition:0.3s;
}

body.light{
  background:#f4f4f4;
  color:#111;
}

header{
  text-align:center;
  padding:20px;
  font-size:26px;
  color:#3ecbff;
}

.container{
  padding:15px;
}

.card{
  background:rgba(255,255,255,0.05);
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

body.light .card{
  background:#fff;
}

.card h3{
  margin:0 0 10px;
}

.card p{
  opacity:0.8;
}

button{
  background:#3ecbff;
  border:none;
  padding:10px 18px;
  border-radius:20px;
  cursor:pointer;
  font-weight:bold;
}

.top-actions{
  position:fixed;
  bottom:20px;
  right:20px;
}

.top-actions button{
  font-size:18px;
}
</style>
</head>

<body>

<header>⚽ مباريات اليوم</header>

<div class="container" id="matches">
  <p>⏳ جاري تحميل المباريات...</p>
</div>

<div class="top-actions">
  <button onclick="toggleMode()">🌓</button>
</div>

<script>
const proxy = "https://api.allorigins.win/raw?url=";
const api = "https://www.scorebat.com/video-api/v3/";

fetch(proxy + encodeURIComponent(api))
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById("matches");
    container.innerHTML = "";

    data.response.slice(0,6).forEach(match => {
      const time = new Date(match.date).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      container.innerHTML += `
        <div class="card">
          <h3>${match.title}</h3>
          <p>⏰ ${time}</p>
          <button onclick="openMatch('${match.matchviewUrl}')">▶ مشاهدة</button>
        </div>
      `;
    });
  })
  .catch(()=>{
    document.getElementById("matches").innerHTML =
      "<p>❌ وقع خطأ في تحميل المباريات</p>";
  });

function openMatch(url){
  window.open(url,"_blank");
}

function toggleMode(){
  document.body.classList.toggle("light");
}
</script>

</body>
</html>
