<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuzSport – مباريات اليوم</title>

<style>
body{
  margin:0;
  font-family:Tahoma, Arial;
  background:#0b1220;
  color:#fff;
  padding:15px;
}

h1{
  text-align:center;
  color:#38bdf8;
}

.refresh{
  display:block;
  margin:15px auto;
  background:#38bdf8;
  color:#000;
  padding:10px 18px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.card{
  background:#111827;
  padding:15px;
  border-radius:14px;
  margin-bottom:15px;
  box-shadow:0 5px 15px rgba(0,0,0,.4);
}

.card h3{
  margin:0 0 8px;
  font-size:16px;
}

.time{
  font-size:13px;
  color:#9ca3af;
  margin-bottom:10px;
}

.badge{
  display:inline-block;
  background:#1d4ed8;
  padding:2px 8px;
  border-radius:8px;
  font-size:11px;
  margin-bottom:8px;
}

.servers button{
  background:#22c55e;
  border:none;
  border-radius:8px;
  padding:6px 10px;
  margin:4px;
  cursor:pointer;
  font-weight:bold;
}

.servers button:nth-child(2){background:#f59e0b;}
.servers button:nth-child(3){background:#ef4444;}
</style>
</head>

<body>

<h1>⚽ مباريات اليوم والقادمة</h1>

<button class="refresh" onclick="loadMatches()">🔄 تحديث المباريات</button>

<div id="matches"></div>

<script>
// ====== بيانات المباريات (تقدر تبدلها وقت ما بغيت) ======
const matchesData = [
  // مباريات اليوم
  {title:"Real Madrid vs Barcelona", time:"21:00", status:"اليوم"},
  {title:"Manchester City vs Arsenal", time:"18:30", status:"اليوم"},
  {title:"Bayern Munich vs Dortmund", time:"20:45", status:"اليوم"},

  // مباريات قادمة
  {title:"PSG vs Marseille", time:"غداً 21:00", status:"قادم"},
  {title:"Wydad vs Raja", time:"غداً 22:00", status:"قادم"},
  {title:"Al Ahly vs Zamalek", time:"بعد غد 20:00", status:"قادم"}
];

// ====== السيرفرات ======
const servers = {
  1: "https://www.yalla-live.tv/",
  2: "https://kooora-live.io/",
  3: "https://livehd7.cc/"
};

// ====== تحميل المباريات ======
function loadMatches(){
  const box = document.getElementById("matches");
  box.innerHTML = "";

  matchesData.forEach(match => {
    box.innerHTML += `
      <div class="card">
        <span class="badge">${match.status}</span>
        <h3>${match.title}</h3>
        <div class="time">⏰ ${match.time}</div>

        <div class="servers">
          <button onclick="openServer(1)">سيرفر 1</button>
          <button onclick="openServer(2)">سيرفر 2</button>
          <button onclick="openServer(3)">سيرفر 3</button>
        </div>
      </div>
    `;
  });
}

// ====== فتح السيرفر ======
function openServer(n){
  window.open(servers[n], "_blank");
}

// تحميل تلقائي
loadMatches();
</script>

</body>
</html>
