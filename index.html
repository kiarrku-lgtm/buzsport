<script>
const proxy = "https://api.allorigins.win/raw?url=";
const api = "https://www.scorebat.com/video-api/v3/";

async function loadMatches(){
  const box = document.getElementById("matches");
  box.innerHTML = "⏳ جاري تحميل المباريات...";

  try{
    const res = await fetch(proxy + encodeURIComponent(api));
    const data = await res.json();

    // حماية من أي تغيير فـ API
    const matches = data?.response || [];

    if(matches.length === 0){
      box.innerHTML = "⚠️ لا توجد مباريات حالياً";
      return;
    }

    box.innerHTML = "";

    matches
      .filter(m => m.date)
      .slice(0,10)
      .forEach(m => {
        let time = "—";
        try{
          time = new Date(m.date).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        }catch{}

        box.innerHTML += `
          <div class="card">
            <h3>${m.title || "مباراة كرة قدم"}</h3>
            <div class="time">⏰ ${time}</div>

            <div class="servers">
              <button onclick="openServer('${m.matchviewUrl}')">سيرفر 1</button>
              <button onclick="openServer('${m.matchviewUrl}')">سيرفر 2</button>
              <button onclick="openServer('${m.matchviewUrl}')">سيرفر 3</button>
            </div>
          </div>
        `;
      });

  }catch(err){
    console.error(err);
    box.innerHTML = "⚠️ وقع خطأ في تحميل المباريات";
  }
}

function openServer(url){
  if(!url){
    alert("السيرفر غير متوفر");
    return;
  }
  window.open(url,"_blank");
}

loadMatches();
</script>
